directories:
  output: dist
  buildResources: build
appId: fr.rebornmc.launcher
productName: RebornMC Launcher
win:
  target: nsis
  icon: assets/logo.ico
files:
  - filter:
      - main.js
      - preload.js
      - renderer/**
      - src/**
      - mod_ban/**
      - assets/**
      - node_modules/**
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 31.7.7
